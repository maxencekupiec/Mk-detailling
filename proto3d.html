<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Prototype 3D — salet&eacute; vers &eacute;clat</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#101216;color:#f4f4f1;overflow:hidden;height:100vh}
#c{position:fixed;inset:0}
.ui{position:fixed;left:0;right:0;text-align:center;z-index:5;pointer-events:none}
.ui.top{top:34px}
.kicker{font-size:0.76rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#7a6cff}
h1{font-size:clamp(1.6rem,3.5vw,2.6rem);font-weight:700;letter-spacing:-0.02em;margin-top:8px}
h1 .g{background:linear-gradient(90deg,#8d85ff,#4d3fff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ui.bottom{bottom:36px}
.slider-wrap{display:inline-flex;align-items:center;gap:16px;background:rgba(16,18,22,0.6);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.12);border-radius:99px;padding:14px 26px;pointer-events:auto}
.slider-wrap span{font-size:0.78rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#9aa0a8}
.slider-wrap span.on{color:#f4f4f1}
input[type=range]{-webkit-appearance:none;width:min(320px,46vw);height:4px;border-radius:4px;background:linear-gradient(90deg,#6b5f4e,#2b1dff);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #2b1dff;box-shadow:0 0 16px rgba(43,29,255,0.7);cursor:grab}
.hint{margin-top:14px;font-size:0.78rem;color:#9aa0a8}
.credit{position:fixed;left:14px;bottom:12px;font-size:0.66rem;color:#5f656e;z-index:5}
.back{position:fixed;top:24px;left:24px;z-index:5;font-size:0.85rem;color:#9aa0a8;text-decoration:none;border:1px solid rgba(255,255,255,0.15);padding:8px 16px;border-radius:99px;background:rgba(16,18,22,0.5);backdrop-filter:blur(8px)}
.back:hover{color:#fff}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#101216;z-index:10;transition:opacity .6s;font-size:0.85rem;letter-spacing:2px;text-transform:uppercase;color:#9aa0a8}
#load.off{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="load">Chargement du mod&egrave;le 3D&hellip;</div>
<a class="back" href="apercu.html">&larr; Retour</a>
<div class="ui top">
  <span class="kicker">Prototype</span>
  <h1>De la poussi&egrave;re &agrave; <span class="g">l'&eacute;clat</span>.</h1>
</div>
<div class="ui bottom">
  <div class="slider-wrap">
    <span id="lblA" class="on">Sale</span>
    <input type="range" id="dirt" min="0" max="100" value="0">
    <span id="lblB">Comme neuve</span>
  </div>
  <div class="hint">Glissez le curseur &middot; faites tourner la voiture avec la souris</div>
</div>
<p class="credit">Prototype &mdash; mod&egrave;le de d&eacute;mo &laquo;&nbsp;Ferrari 458&nbsp;&raquo; (CC-BY vicent091036), sera remplac&eacute; par le mod&egrave;le final</p>
<canvas id="c"></canvas>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101216);
scene.fog = new THREE.Fog(0x101216, 12, 24);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(5.2, 1.6, 5.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.6, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 4; controls.maxDistance = 10;
controls.maxPolarAngle = Math.PI * 0.52;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;

// sol
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(14, 48),
  new THREE.MeshStandardMaterial({ color: 0x15171c, roughness: 0.9, metalness: 0.1 })
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// halo bleu sous la voiture
const glow = new THREE.Mesh(
  new THREE.CircleGeometry(3.2, 48),
  new THREE.MeshBasicMaterial({ color: 0x2b1dff, transparent: true, opacity: 0.0 })
);
glow.rotation.x = -Math.PI/2; glow.position.y = 0.005;
scene.add(glow);

const spot = new THREE.DirectionalLight(0xffffff, 1.6);
spot.position.set(4, 8, 4);
scene.add(spot, new THREE.AmbientLight(0xffffff, 0.25));

// etats sale / propre
const DIRTY = { color: new THREE.Color(0x58503f), rough: 0.9, clear: 0.0, metal: 0.2 };
const CLEAN = { color: new THREE.Color(0x1a10d8), rough: 0.08, clear: 1.0, metal: 0.9 };

const bodyMat = new THREE.MeshPhysicalMaterial({ color: DIRTY.color.clone(), metalness: DIRTY.metal, roughness: DIRTY.rough, clearcoat: DIRTY.clear, clearcoatRoughness: 0.03 });
const detailsMatD = { rough: 0.8, metal: 0.4 }, detailsMatC = { rough: 0.25, metal: 1.0 };
const detailsMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: detailsMatD.metal, roughness: detailsMatD.rough });
const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xcccccc, metalness: 0, roughness: 0.45, transmission: 0.85, transparent: true });

const draco = new DRACOLoader();
draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

loader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/models/gltf/ferrari.glb', (gltf) => {
  const car = gltf.scene.children[0];
  car.getObjectByName('body').material = bodyMat;
  ['rim_fl','rim_fr','rim_rl','rim_rr','trim'].forEach(n => { const o = car.getObjectByName(n); if (o) o.material = detailsMat; });
  const g = car.getObjectByName('glass'); if (g) g.material = glassMat;
  car.position.y = 0;
  scene.add(car);
  document.getElementById('load').classList.add('off');
});

// interpolation
const slider = document.getElementById('dirt');
let target = 0, cur = 0, userTouched = false, dir = 1;
slider.addEventListener('input', () => { userTouched = true; target = slider.value / 100; });
slider.addEventListener('pointerdown', () => userTouched = true);

function lerp(a, b, t) { return a + (b - a) * t; }
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  // demo auto : aller-retour tant que pas touche
  if (!userTouched) {
    target += dir * clock.getDelta() * 0.25;
    if (target > 1) { target = 1; dir = -1; }
    if (target < 0) { target = 0; dir = 1; }
    slider.value = target * 100;
  } else { clock.getDelta(); }
  cur += (target - cur) * 0.08;

  bodyMat.color.lerpColors(DIRTY.color, CLEAN.color, cur);
  bodyMat.roughness = lerp(DIRTY.rough, CLEAN.rough, cur);
  bodyMat.clearcoat = lerp(DIRTY.clear, CLEAN.clear, cur);
  bodyMat.metalness = lerp(DIRTY.metal, CLEAN.metal, cur);
  detailsMat.roughness = lerp(detailsMatD.rough, detailsMatC.rough, cur);
  detailsMat.metalness = lerp(detailsMatD.metal, detailsMatC.metal, cur);
  glassMat.roughness = lerp(0.45, 0.02, cur);
  glow.material.opacity = cur * 0.22;
  renderer.toneMappingExposure = lerp(0.8, 1.05, cur);

  document.getElementById('lblA').classList.toggle('on', cur < 0.5);
  document.getElementById('lblB').classList.toggle('on', cur >= 0.5);

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
